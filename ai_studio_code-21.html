<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍎 도전! 67초 사과 바구니</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap');
        
        :root {
            --apple-red: #ff4d4d;
            --apple-dark: #d63031;
            --leaf-green: #6ab04c;
            --bg-cream: #fff9e6;
            --wood: #795548;
        }

        body { 
            font-family: 'Gaegu', cursive; 
            background-color: var(--bg-cream); 
            margin: 0; padding: 0; 
            color: #2d3436;
            overflow-x: hidden;
        }

        /* 배경 장식 */
        body::before {
            content: "🍎"; position: fixed; top: 10%; left: 5%; font-size: 5rem; opacity: 0.1; z-index: -1;
        }
        body::after {
            content: "🍏"; position: fixed; bottom: 10%; right: 5%; font-size: 5rem; opacity: 0.1; z-index: -1;
        }

        .container { 
            max-width: 600px; margin: 80px auto 20px; 
            background: #fff; padding: 40px 20px; 
            border-radius: 50px; border: 10px solid var(--apple-red); 
            box-shadow: 0 15px 0 var(--apple-dark); 
            text-align: center; position: relative;
        }

        /* 67초 강조 헤더 */
        .mission-header {
            position: fixed; top: 0; left: 0; right: 0;
            background: var(--apple-red); color: white;
            padding: 10px; font-size: 2rem; font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); z-index: 100;
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .mission-header .target-num {
            background: white; color: var(--apple-red);
            padding: 2px 15px; border-radius: 20px; font-size: 2.5rem;
        }

        h1 { font-size: 3rem; margin-top: 0; color: var(--apple-dark); }
        
        /* 버튼 공통 스타일 */
        .btn {
            font-family: 'Gaegu'; font-size: 1.8rem; padding: 15px 30px;
            cursor: pointer; border: none; border-radius: 50px;
            transition: 0.3s; margin: 10px; width: 85%;
            box-shadow: 0 8px 0 #b33939; position: relative; top: 0;
        }
        .btn:hover { top: -2px; box-shadow: 0 10px 0 #b33939; }
        .btn:active { top: 4px; box-shadow: 0 4px 0 #b33939; }
        
        .btn-red { background-color: var(--apple-red); color: white; }
        .btn-green { background-color: var(--leaf-green); color: white; box-shadow: 0 8px 0 #3b7d23; }
        .btn-green:hover { box-shadow: 0 10px 0 #3b7d23; }
        .btn-green:active { box-shadow: 0 4px 0 #3b7d23; }
        .btn-back { background: #95afc0; color: white; box-shadow: 0 5px 0 #647683; width: auto; font-size: 1.2rem; padding: 8px 20px; }

        input, select {
            font-family: 'Gaegu'; font-size: 1.6rem; padding: 15px;
            border-radius: 20px; border: 4px solid #fab1a0;
            margin: 10px 0; width: 80%; text-align: center; outline: none;
        }

        .hidden { display: none; }
        
        /* 타이머 & 사과 애니메이션 */
        .apple-timer-wrapper { margin: 30px 0; }
        .big-apple { font-size: 8rem; display: inline-block; transition: 0.5s; cursor: pointer; }
        .apple-active { animation: pulse 0.5s infinite; }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* 선생님 대시보드 스킨 */
        .admin-view { max-width: 950px; border-color: var(--leaf-green); box-shadow: 0 15px 0 #3b7d23; }
        .qr-section { background: #f9f9f9; padding: 20px; border-radius: 30px; margin-bottom: 20px; border: 2px dashed var(--leaf-green); }
        .team-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
        .team-card { background: #fffdf2; padding: 20px; border-radius: 30px; border: 5px solid #fab1a0; position: relative; }
        .total-score { font-size: 3rem; color: var(--apple-dark); font-weight: bold; margin: 10px 0; }
        .perfect-score { color: gold; text-shadow: 2px 2px #333; animation: bounce 0.5s infinite alternate; }
        @keyframes bounce { from {transform: translateY(0);} to {transform: translateY(-10px);} }

        .log-list { font-size: 1.2rem; text-align: left; background: white; padding: 15px; border-radius: 15px; height: 120px; overflow-y: auto; border: 1px solid #eee; }
    </style>
</head>
<body>

<div class="mission-header">
    🎯 목표: <span class="target-num">67.00</span> 초를 맞춰라!
</div>

<!-- 1. 초기 화면 -->
<div class="container" id="screen-main">
    <h1>🍎<br>사과 바구니 채우기</h1>
    <button onclick="showTeacherSetup()" class="btn btn-green">선생님 메뉴</button>
    <button onclick="showStudentSetup()" class="btn btn-red">학생 참여하기</button>
</div>

<!-- 2. 선생님 방 설정 -->
<div class="container hidden" id="screen-teacher-setup">
    <button onclick="goBack('screen-main')" class="btn btn-back">← 뒤로가기</button>
    <h1>방 만들기</h1>
    <p>아이들과 공유할 방 번호를 직접 정해주세요</p>
    <input type="text" id="input-admin-room" placeholder="예: 3학년1반" maxlength="10">
    <button onclick="createRoom()" class="btn btn-green">방 개설하고 시작하기</button>
</div>

<!-- 3. 학생 방 찾기 -->
<div class="container hidden" id="screen-student-find">
    <button onclick="goBack('screen-main')" class="btn btn-back">← 뒤로가기</button>
    <h1>방 입장하기</h1>
    <input type="text" id="input-student-room" placeholder="선생님이 정한 방 번호">
    <button onclick="checkRoom()" class="btn btn-red">방 찾기</button>
</div>

<!-- 4. 학생 이름/팀 선택 -->
<div class="container hidden" id="screen-student-login">
    <h1 id="room-name-display">🍎</h1>
    <input type="text" id="student-name" placeholder="내 이름">
    <select id="team-select">
        <option value="1모둠">1모둠 🍎</option>
        <option value="2모둠">2모둠 🍏</option>
        <option value="3모둠">3모둠 🍓</option>
        <option value="4모둠">4모둠 🍒</option>
    </select>
    <button onclick="joinGame()" class="btn btn-red">게임 입장!</button>
</div>

<!-- 5. 학생 게임 화면 -->
<div class="container hidden" id="screen-student-game">
    <div id="lock-msg" style="background:#ff7675; color:white; padding:10px; border-radius:15px; margin-bottom:10px;" class="hidden">🔒 선생님이 잠시 멈췄어요!</div>
    <div class="apple-timer-wrapper">
        <div class="big-apple" id="apple-icon">🍎</div>
        <div id="student-timer" style="font-size: 4rem; color: var(--apple-dark); margin: 10px 0;">준비!</div>
    </div>
    <button id="startBtn" class="btn btn-red" onclick="startTimer()">시작!</button>
    <button id="stopBtn" class="btn btn-red hidden" onclick="stopTimer()">정지!</button>
    <button id="sendBtn" class="btn btn-green hidden" onclick="sendScore()">기록 보내기 📤</button>
</div>

<!-- 6. 선생님 대시보드 (전광판) -->
<div class="container admin-view hidden" id="screen-admin">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <button onclick="location.reload()" class="btn btn-back">← 종료하고 처음으로</button>
        <h2 style="margin:0;">🏠 방: <span id="admin-room-display"></span></h2>
    </div>
    
    <div class="qr-section">
        <div id="qrcode" style="display: flex; justify-content: center; margin-bottom: 10px;"></div>
        <p>아이들이 QR코드를 찍으면 바로 입장할 수 있어요!</p>
    </div>
    
    <div style="margin: 20px 0;">
        <button id="lockBtn" onclick="toggleLock(true)" class="btn btn-red" style="width: 45%;">모두 멈춤</button>
        <button id="unlockBtn" onclick="toggleLock(false)" class="btn btn-green" style="width: 45%;">다시 시작</button>
    </div>
    
    <div class="team-grid" id="team-display"></div>
    <button onclick="resetGame()" class="btn btn-back" style="margin-top:40px; background: #636e72;">전체 기록 초기화</button>
</div>

<script>
    // --- [Firebase 설정] ---
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
        projectId: "YOUR_PROJECT",
        storageBucket: "YOUR_PROJECT.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentRoom = "";
    let startTime, timerInterval, elapsed = 0;
    let isLocked = false;

    // URL 자동 방 체크
    window.onload = () => {
        const urlParams = new URLSearchParams(window.location.search);
        const r = urlParams.get('room');
        if(r) { document.getElementById('input-student-room').value = r; checkRoom(); }
    };

    function showScreen(id) {
        document.querySelectorAll('.container').forEach(c => c.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
    }

    function goBack(id) { showScreen(id); }

    // [선생님] 방 개설
    function showTeacherSetup() { showScreen('screen-teacher-setup'); }
    function createRoom() {
        const rId = document.getElementById('input-admin-room').value.trim();
        if(!rId) return alert("방 이름을 정해줘!");
        currentRoom = rId;
        document.getElementById('admin-room-display').innerText = rId;
        
        // QR코드
        const joinUrl = window.location.origin + window.location.pathname + "?room=" + encodeURIComponent(rId);
        document.getElementById('qrcode').innerHTML = "";
        new QRCode(document.getElementById("qrcode"), { text: joinUrl, width: 140, height: 140 });

        db.ref('rooms/' + rId + '/settings').update({ isLocked: false });
        showScreen('screen-admin');
        initAdminListener();
    }

    // [학생] 입장
    function showStudentSetup() { showScreen('screen-student-find'); }
    function checkRoom() {
        const rId = document.getElementById('input-student-room').value.trim();
        db.ref('rooms/' + rId).once('value', (snap) => {
            if (snap.exists()) {
                currentRoom = rId;
                document.getElementById('room-name-display').innerText = "🍎 " + rId;
                showScreen('screen-student-login');
                listenToLock();
            } else { alert("방을 찾을 수 없어요. 번호를 확인해줘!"); }
        });
    }

    function joinGame() {
        if(!document.getElementById('student-name').value) return alert("이름을 써줘!");
        showScreen('screen-student-game');
    }

    function listenToLock() {
        db.ref('rooms/' + currentRoom + '/settings/isLocked').on('value', (snap) => {
            isLocked = snap.val();
            document.getElementById('lock-msg').classList.toggle('hidden', !isLocked);
            document.getElementById('startBtn').disabled = isLocked;
        });
    }

    // [학생] 게임 로직
    function startTimer() {
        startTime = Date.now();
        document.getElementById('apple-icon').classList.add('apple-active');
        document.getElementById('student-timer').innerText = "재는 중...";
        document.getElementById('startBtn').classList.add('hidden');
        document.getElementById('stopBtn').classList.remove('hidden');
    }

    function stopTimer() {
        elapsed = (Date.now() - startTime) / 1000;
        document.getElementById('apple-icon').classList.remove('apple-active');
        document.getElementById('student-timer').innerText = elapsed.toFixed(2) + "초!";
        document.getElementById('stopBtn').classList.add('hidden');
        document.getElementById('sendBtn').classList.remove('hidden');
    }

    function sendScore() {
        const name = document.getElementById('student-name').value;
        const team = document.getElementById('team-select').value;
        db.ref('rooms/' + currentRoom + '/scores/' + team).push({ name: name, time: elapsed });
        alert("성공적으로 보냈어! 🍎");
        document.getElementById('sendBtn').classList.add('hidden');
        document.getElementById('startBtn').classList.remove('hidden');
        document.getElementById('student-timer').innerText = "준비!";
    }

    // [선생님] 전광판 로직
    function initAdminListener() {
        db.ref('rooms/' + currentRoom + '/scores').on('value', (snapshot) => {
            const display = document.getElementById('team-display');
            display.innerHTML = "";
            const teams = ["1모둠", "2모둠", "3모둠", "4모둠"];
            const data = snapshot.val() || {};

            teams.forEach(tId => {
                let total = 0, logs = "";
                if (data[tId]) {
                    Object.values(data[tId]).forEach(v => {
                        total += v.time;
                        logs += `<div><b>${v.name}</b>: ${v.time}s</div>`;
                    });
                }
                const isPerfect = total.toFixed(2) === "67.00";
                if(isPerfect) confetti({ particleCount: 200, spread: 80, origin: { y: 0.6 } });

                const card = document.createElement('div');
                card.className = 'team-card';
                card.innerHTML = `
                    <h2 style="margin:0; color:var(--wood)">${tId}</h2>
                    <div class="total-score ${isPerfect ? 'perfect-score' : ''}">${total.toFixed(2)}s</div>
                    <div class="log-list">${logs}</div>
                `;
                display.appendChild(card);
            });
        });
    }

    function toggleLock(val) { db.ref('rooms/' + currentRoom + '/settings').update({ isLocked: val }); }
    function resetGame() { if(confirm("기록을 다 지울까요?")) db.ref('rooms/' + currentRoom + '/scores').remove(); }
</script>
</body>
</html>
